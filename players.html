<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игроки онлайн · TURBINA TURISTA 18+</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;800;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--hot:#ff4d00;--ember:#ff9a3c;--bone:#efe6da;--dim:#93826f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',sans-serif;color:var(--bone);overflow-x:hidden;line-height:1.6;background:#070302;
background-image:radial-gradient(ellipse 90% 50% at 50% -10%,rgba(255,77,0,.18),transparent 60%)}

#loader{position:fixed;inset:0;z-index:999;background:#070302;display:flex;align-items:center;justify-content:center}
#loader .lg{font-family:'Unbounded';font-weight:900;font-size:clamp(20px,5vw,32px);text-transform:uppercase;
background:linear-gradient(120deg,#fff,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;
animation:lp 1.4s ease-in-out infinite}
@keyframes lp{50%{opacity:.5}}

.wrap{max-width:740px;margin:0 auto;padding:30px 20px 80px}

.top{text-align:center;margin-bottom:34px}
.back{display:inline-block;font-family:'Unbounded';font-size:10px;letter-spacing:.25em;text-transform:uppercase;
color:var(--dim);text-decoration:none;border:1px solid rgba(255,77,0,.35);border-radius:99px;
padding:11px 24px;margin-bottom:26px;transition:.25s;background:rgba(255,77,0,.06)}
.back:hover{color:var(--ember);border-color:rgba(255,77,0,.6);transform:translateY(-3px)}
h1{font-family:'Unbounded';font-weight:900;font-size:clamp(28px,7vw,52px);text-transform:uppercase}
h1 em{font-style:normal;color:var(--hot);text-shadow:0 0 36px rgba(255,77,0,.55)}
.live{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-family:'Unbounded';
font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#4ade80}
.live::before{content:'';width:8px;height:8px;border-radius:50%;background:#4ade80;
box-shadow:0 0 12px #4ade80;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}

.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.stat{padding:16px 30px;border-radius:22px;text-align:center;border:1px solid rgba(255,220,190,.15);
background:linear-gradient(135deg,rgba(255,77,0,.08),rgba(255,255,255,.02))}
.stat b{display:block;font-family:'Unbounded';font-weight:800;font-size:22px;color:var(--hot)}
.stat span{font-size:8.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;font-family:'Unbounded'}

.tbl-wrap{overflow-x:auto;border-radius:26px;border:1px solid rgba(255,220,190,.25);
background:linear-gradient(135deg,rgba(255,77,0,.07),rgba(255,255,255,.03));
box-shadow:0 18px 48px rgba(0,0,0,.45);padding:8px}
table{width:100%;border-collapse:collapse;min-width:520px}
th{font-family:'Unbounded';font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--hot);
padding:15px 14px;text-align:left;border-bottom:1px solid rgba(255,77,0,.35)}
td{padding:14px;font-size:14px;border-bottom:1px dashed rgba(232,221,208,.1)}
tbody tr:last-child td{border:none}
tbody tr{transition:.15s}
tbody tr:hover{background:rgba(255,77,0,.09)}
.pos{font-family:'Unbounded';font-weight:800;font-size:13px;width:46px}
.p1 .pos{color:#ffd700}.p2 .pos{color:#c0c0c0}.p3 .pos{color:#cd7f32}
.nick{font-weight:800}
.spec{color:#6b5d4d!important;font-style:italic}
.sc{font-family:'Unbounded';font-weight:800;color:var(--hot)}
.tm{color:var(--dim)}
.empty{text-align:center;color:var(--dim);padding:44px!important;font-family:'Unbounded';font-size:11px;letter-spacing:.15em}

.note{margin-top:22px;text-align:center;font-size:9px;letter-spacing:.28em;color:rgba(138,122,106,.6);
text-transform:uppercase;font-family:'Unbounded'}
.note b{color:var(--hot)}

@media(max-width:600px){th:nth-child(4),td:nth-child(4){display:none}table{min-width:360px}}
</style>
</head>
<body>

<div id="loader"><div class="lg">Загрузка…</div></div>

<div class="wrap">

<div class="top">
<a class="back" href="./">← На главную</a>
<h1>Игроки <em>Онлайн</em></h1>
<div class="live">Live · обновление каждые 30 сек · без ботов</div>
</div>

<div class="stats">
<div class="stat"><b id="stOnline">…</b><span>Игроков</span></div>
<div class="stat"><b id="stTop">—</b><span>Топ фрагов</span></div>
<div class="stat"><b id="stMap">—</b><span>Карта</span></div>
</div>

<div class="tbl-wrap">
<table>
<thead><tr><th>#</th><th>Игрок</th><th>Фраги</th><th>Время</th></tr></thead>
<tbody id="pBody"><tr><td colspan="4" class="empty">Загружаем игроков…</td></tr></tbody>
</table>
</div>

<p class="note">Turbina Turista <b>18+</b> · данные gs4u.net</p>

</div>

<script>
var WORKER='https://turbina-online.maznatskijerzan.workers.dev';

setTimeout(function(){var l=document.getElementById('loader');
if(l){l.style.transition='opacity .35s';l.style.opacity='0';l.style.pointerEvents='none';
setTimeout(function(){l.style.display='none'},400)}},700);

function fmt(t){
 if(!t)return '—';
 var spec=t.indexOf('-')===0;
 return spec?'спектатор 👁':t.split(':').slice(0,2).join(':');
}

function load(){
 fetch(WORKER+'?board=1',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
   var ps=(d.players||[]).slice().sort(function(a,b){return b.score-a.score});
   document.getElementById('stOnline').textContent=ps.length;
   var b=document.getElementById('pBody');
   if(!ps.length){
     b.innerHTML='<tr><td colspan="4" class="empty">На сервере сейчас пусто 😴</td></tr>';
     document.getElementById('stTop').textContent='—';
     return;
   }
   document.getElementById('stTop').textContent=ps[0].score+' фр.';
   b.innerHTML=ps.map(function(p,i){
     var spec=/^-/.test(p.time||'');
     return '<tr class="'+(i<3?'p'+(i+1):'')+'">'+
       '<td class="pos">'+['🥇','🥈','🥉'][i]||(i+1)+'</td>'.replace(/^.*$/,'<td class="pos">'+(i<3?['🥇','🥈','🥉'][i]:i+1)+'</td>')+
       '<td class="nick'+(spec?' spec':'')+'">'+String(p.name).replace(/</g,'&lt;')+(spec?' 👁':'')+'</td>'+
       '<td class="sc">'+p.score+'</td>'+
       '<td class="tm">'+fmt(p.time)+'</td></tr>';
   }).join('');
 }).catch(function(){
   document.getElementById('pBody').innerHTML=
     '<tr><td colspan="4" class="empty">Не удалось загрузить данные 😕</td></tr>';
 });
}

/* карта из основного ответа воркера */
fetch(WORKER).then(function(r){return r.text()}).then(function(t){
 var m=t.match(/de_[a-z0-9_]+|[a-z]{2,6}_[a-z0-9_]{3,}/i);
 if(m)document.getElementById('stMap').textContent=m[0];
}).catch(function(){});

load();
setInterval(load,30000);
</script>
</body>
</html>
